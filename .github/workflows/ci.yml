name: Python toolkit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-hosting:
    name: Native ADBC hosting lifecycle (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Query-farm/grainlift
          ref: 357b426b0a4eb0790a18ae2c96f5df72cf50f768 # v0.4.3
          path: native-driver
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native-driver
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.7
      - run: uv sync --locked --extra granian --extra storage --python 3.14
      - run: cargo build --locked -p adbc-driver-grainlift
        working-directory: native-driver
      - name: Install the wheel and exercise real native transports
        run: |
          uv build
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          export GRAINLIFT_NATIVE_DRIVER="$PWD/native-driver/target/debug/libadbc_driver_grainlift.so"
          uv run --no-sync pytest -q tests/test_native_hosting.py tests/test_tcp.py tests/test_hosting.py tests/test_isolation.py tests/test_external_storage.py

  test:
    name: Toolkit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.7
      - run: uv sync --locked --extra granian --extra storage --python '${{ matrix.python }}'
      - name: Ruff, strict mypy, and isolated pydoclint
        run: ./check_quality.sh
      - name: Build distributions and install the wheel
        run: |
          uv build
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
      - name: Verify installed package location
        run: |
          uv run --no-sync python - <<'PY'
          import pathlib
          import sys
          import grainlift
          package = pathlib.Path(grainlift.__file__).resolve()
          assert package.is_relative_to(pathlib.Path(sys.prefix).resolve()), package
          assert "site-packages" in package.parts, package
          PY
      - name: Test the installed wheel
        run: uv run --no-sync python -m pytest tests -q --junitxml=test-results.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolkit-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore
